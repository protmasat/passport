  url: http://localhost:3400/api/v1/passports
  body:
    type: json
    data: |-
      {
        "passportType": "P",
        "passportNumber": "AB1234567",
        "surname": "MDUDU",
        "name": "NGATELE",
        "nationality": "Tanzania",
        "dateOfBirth": "1995-05-20",
        "sex": "male",
        "issueDate": "2024-01-15",
        "expiryDate": "2034-01-14",
