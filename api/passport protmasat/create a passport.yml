info:
  name: create a passport
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:3400/api/v1/passports
  body:
    type: json
    data: |-
      {
        "passportType": "ORDINARY",
        "stateCode": "TZ",
        "surname": "NYAGAWA",
        "name": "JOHN",
        "nationality": "TANZANIA",
        "dateOfBirth": "1995-05-20",
        "sex": "male",
        "issueDate": "2025-01-15",
        "expiryDate": "2035-01-14",
        "placeOfBirth": "ZANZIBAR",
        "issuingAuthority": "IMMIGRATION DEPARTMENT",
        "electronicallPrintedSignature": "AUTHORIZED SIGNATORY"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
